mklabel msdos
mkpart primary fat32	0		256MiB	# label=PIBOOT	mount=/boot
mkpart primary ext4	256MiB	512MiB	# label=PIPST	mount=/var/lib/kvmd/pst	reserved=0
mkpart primary ext4	512MiB	4608MiB	# label=PIROOT	mount=/
mkpart primary ext4	4608MiB	6656MiB	# label=PIDATA	mount=/var/lib/kvmd/data	reserved=0
